<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La sala, en vivo</title>
<!--
  La pantalla del proyector. Se abre en la computadora de quien presenta y se
  actualiza sola cada cinco segundos mientras los directores van sumando.

  NO MUESTRA A NADIE. Lo que llega son tres numeros y las horas de contrato de
  cada uno, sin nombre y sin el relato del dia. Lo individual lo ve cada
  director en su telefono; aca solo esta el curso completo.

  EL PORCENTAJE DEL GRUPO VA SOBRE LA SUMA DE LAS JORNADAS, no como promedio de
  porcentajes: si no, un director de media jornada pesaria igual que uno de
  jornada completa.
-->
<style>
:root{
  --tinta:#022C3A; --ambar:#FBAE00; --naranja:#E8590C;
  --alta:#2F7A52; --media:#1D5C8F; --baja:#B8430A;
  --titulo:'Bebas Neue','Arial Narrow',Impact,sans-serif;
  --fuente:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--tinta);color:#fff;font-family:var(--fuente);
  min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  padding:3vh 4vw}
.ceja{font-size:clamp(13px,1.5vw,18px);font-weight:800;color:var(--ambar);
  letter-spacing:.04em;text-transform:uppercase}
h1{font-family:var(--titulo);font-size:clamp(44px,9vw,120px);line-height:.92;margin:10px 0 0;
  text-transform:uppercase}
h1 span{color:var(--ambar)}
.sub{font-size:clamp(15px,2vw,26px);color:#9fb4bf;margin-top:10px;max-width:40ch}
.barra{display:flex;height:clamp(40px,7vh,72px);border-radius:14px;overflow:hidden;
  margin:4vh 0 2vh;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06)}
.barra div{display:flex;align-items:center;justify-content:center;
  font-size:clamp(14px,1.8vw,24px);font-weight:800;color:#fff;transition:width .6s ease}
.clave{display:flex;gap:clamp(14px,3vw,46px);flex-wrap:wrap;
  font-size:clamp(13px,1.6vw,21px);color:#cfd9de}
.clave i{width:14px;height:14px;border-radius:4px;display:inline-block;margin-right:8px}
.pie{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;
  margin-top:5vh;flex-wrap:wrap}
.n{font-family:var(--titulo);font-size:clamp(32px,5vw,64px);line-height:1}
.n small{display:block;font-family:var(--fuente);font-size:clamp(12px,1.3vw,16px);
  font-weight:700;color:#9fb4bf;letter-spacing:.04em;text-transform:uppercase}
.ref{font-size:clamp(12px,1.4vw,18px);color:#9fb4bf;max-width:46ch;text-align:right}
.ref b{color:#fff}
.estado{font-family:var(--mono);font-size:12px;color:#6d8591;margin-top:12px}
.vacio{font-size:clamp(16px,2vw,24px);color:#9fb4bf;margin-top:4vh}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="ceja">El Director LIBRE · L de Localiza · en vivo</div>
<div id="todo">
  <h1 id="titular">Esperando el primer resultado</h1>
  <p class="vacio" id="vacio">Cuando los directores toquen «sumar mi resultado al grupo»,
  esta pantalla se actualiza sola.</p>
</div>
<p class="estado" id="estado"></p>

<script>
var API = "https://localiza-api-eight.vercel.app/api/sala";
var COLOR = { ped: "#2F7A52", suyo: "#1D5C8F", del: "#B8430A" };
var NOMBRE = { ped: "Probabilidad alta", suyo: "Media", del: "Baja" };

function rotulo(m){
  if (m < 60) return m + " min";
  var h = Math.floor(m / 60), r = m % 60;
  return h + " h" + (r ? " " + r : "");
}

function pintar(d){
  if (!d.n) return;
  var m = d.minutos, jor = m.jornada || 1;
  var sin = Math.round((m.suyo + m.del) / jor * 100);
  var barras = ["ped", "suyo", "del"].filter(function(k){ return m[k] > 0; })
    .map(function(k){
      var p = Math.round(m[k] / jor * 100);
      return '<div style="width:' + (m[k] / jor * 100) + '%;background:' + COLOR[k] + '">' +
        (p >= 7 ? p + "%" : "") + "</div>";
    }).join("");
  var clave = ["ped", "suyo", "del"].map(function(k){
    return '<span><i style="background:' + COLOR[k] + '"></i>' + NOMBRE[k] + " · " +
      rotulo(m[k]) + "</span>";
  }).join("");

  document.getElementById("todo").innerHTML =
    '<h1>El <span>' + sin + "%</span> de nuestro día no tuvo impacto directo en los " +
    "aprendizajes</h1>" +
    '<div class="barra">' + barras + "</div>" +
    '<div class="clave">' + clave + "</div>" +
    '<div class="pie"><div class="n">' + d.n + "<small>" +
    (d.n === 1 ? "director" : "directores") + " en la sala</small></div>" +
    '<div class="ref">El libro dice que a la mayoría le da <b>más del 70%</b>. ' +
    "En liderazgo pedagógico estamos en <b>" + d.pct.ped + "%</b>: la referencia " +
    "regional es 24% y la meta del libro, 50%.</div></div>";
}

function traer(){
  fetch(API, { cache: "no-store" })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && typeof d.n === "number") {
        pintar(d);
        document.getElementById("estado").textContent =
          "actualizado " + new Date().toLocaleTimeString("es-CL");
      }
    })
    .catch(function(){
      document.getElementById("estado").textContent = "sin conexión, reintentando";
    });
}
traer();
setInterval(traer, 5000);
</script>
</body>
</html>
